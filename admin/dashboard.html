<!DOCTYPE html>
<html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin Dashboard</title><link rel="stylesheet" href="../css/style.css"></head>
<body><div class="app"><aside class="sidebar"><h2>Admin Panel</h2><nav><a class="active" href="dashboard.html">Dashboard</a><a href="users.html">Users</a><a href="transactions.html">Transactions</a><a href="#" onclick="logout()">Logout</a></nav></aside><main class="content"><h1>Admin Dashboard</h1><div class="cards"><div class="card"><h3>Registered Users</h3><div id="users" class="amount">0</div></div><div class="card"><h3>Transactions</h3><div id="tx" class="amount">0</div></div><div class="card"><h3>Total Income</h3><div id="income" class="amount">₹0</div></div><div class="card"><h3>Total Expenses</h3><div id="expense" class="amount">₹0</div></div></div><section class="form-card"><h2>System Overview</h2><p>Admin can monitor registered users and all transactions stored in this browser.</p></section></main></div><script src="../js/common.js"></script><script>const u=requireRole('admin');if(u){const us=JSON.parse(localStorage.getItem('expenseUsers')||'[]'),a=getExpenses();users.textContent=us.length;tx.textContent=a.length;income.textContent=money(a.filter(x=>x.type==='income').reduce((s,x)=>s+Number(x.amount),0));expense.textContent=money(a.filter(x=>x.type==='expense').reduce((s,x)=>s+Number(x.amount),0))}</script></body></html>
