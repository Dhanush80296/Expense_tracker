<!DOCTYPE html>
<html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Manage Users</title><link rel="stylesheet" href="../css/style.css"></head>
<body><div class="app"><aside class="sidebar"><h2>Admin Panel</h2><nav><a href="dashboard.html">Dashboard</a><a class="active" href="users.html">Users</a><a href="transactions.html">Transactions</a><a href="#" onclick="logout()">Logout</a></nav></aside><main class="content"><h1>Registered Users</h1><div class="table-wrap"><table class="table"><thead><tr><th>Name</th><th>Email</th><th>Created</th><th>Action</th></tr></thead><tbody id="body"></tbody></table></div></main></div><script src="../js/common.js"></script><script>requireRole('admin');function render(){const a=JSON.parse(localStorage.getItem('expenseUsers')||'[]');body.innerHTML=a.length?a.map(x=>`<tr><td>${x.name}</td><td>${x.email}</td><td>${new Date(x.createdAt).toLocaleDateString()}</td><td><button class="btn danger" onclick="delUser('${x.email}')">Delete</button></td></tr>`).join(''):'<tr><td colspan="4" class="empty">No users registered.</td></tr>'}function delUser(email){localStorage.setItem('expenseUsers',JSON.stringify(JSON.parse(localStorage.getItem('expenseUsers')||'[]').filter(x=>x.email!==email)));saveExpenses(getExpenses().filter(x=>x.email!==email));const b=getBudgets();delete b[email];saveBudgets(b);render()}render()</script></body></html>
