<!DOCTYPE html>
<html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>All Transactions</title><link rel="stylesheet" href="../css/style.css"></head>
<body><div class="app"><aside class="sidebar"><h2>Admin Panel</h2><nav><a href="dashboard.html">Dashboard</a><a href="users.html">Users</a><a class="active" href="transactions.html">Transactions</a><a href="#" onclick="logout()">Logout</a></nav></aside><main class="content"><h1>All Transactions</h1><div class="table-wrap"><table class="table"><thead><tr><th>Date</th><th>User</th><th>Title</th><th>Category</th><th>Type</th><th>Amount</th><th>Action</th></tr></thead><tbody id="body"></tbody></table></div></main></div><script src="../js/common.js"></script><script>requireRole('admin');function render(){const us=JSON.parse(localStorage.getItem('expenseUsers')||'[]'),a=getExpenses();body.innerHTML=a.length?a.map(x=>{const user=us.find(u=>u.email===x.email);return `<tr><td>${x.date}</td><td>${user?user.name:x.email}</td><td>${x.title}</td><td>${x.category}</td><td><span class="badge ${x.type}">${x.type}</span></td><td>${money(x.amount)}</td><td><button class="btn danger" onclick="delTx(${x.id})">Delete</button></td></tr>`}).join(''):'<tr><td colspan="7" class="empty">No transactions.</td></tr>'}function delTx(id){saveExpenses(getExpenses().filter(x=>x.id!==id));render()}render()</script></body></html>
