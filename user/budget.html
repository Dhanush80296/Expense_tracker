<!DOCTYPE html>
<html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Budget</title><link rel="stylesheet" href="../css/style.css"></head>
<body><div class="app"><aside class="sidebar"><h2>Expense Tracker</h2><nav><a href="dashboard.html">Dashboard</a><a href="add-expense.html">Add Transaction</a><a href="expenses.html">Transactions</a><a class="active" href="budget.html">Budget</a><a href="reports.html">Reports</a><a href="#" onclick="logout()">Logout</a></nav></aside><main class="content"><h1>Monthly Budget</h1><section class="form-card"><form id="budgetForm"><label>Monthly Budget (₹)</label><input id="budget" type="number" min="0" required><button class="btn primary" type="submit">Save Budget</button></form><p id="msg"></p></section><section class="form-card"><h2>Budget Usage</h2><p>Spent this month: <b id="spent">₹0</b></p><p>Budget: <b id="showBudget">₹0</b></p><div class="progress"><div id="bar"></div></div><p id="status"></p></section></main></div><script src="../js/common.js"></script><script>const u=requireRole('user');function render(){const b=getBudgets()[u.email]||0;budget.value=b;showBudget.textContent=money(b);const now=new Date();const s=getExpenses().filter(x=>x.email===u.email&&x.type==='expense'&&new Date(x.date).getMonth()===now.getMonth()&&new Date(x.date).getFullYear()===now.getFullYear()).reduce((a,x)=>a+Number(x.amount),0);spent.textContent=money(s);bar.style.width=Math.min(b? s/b*100:0,100)+'%';status.textContent=b&&s>b?'Budget exceeded!':'You are within your budget.';status.className=b&&s>b?'warning':'success'}budgetForm.addEventListener('submit',e=>{e.preventDefault();const b=getBudgets();b[u.email]=Number(budget.value);saveBudgets(b);msg.textContent='Budget saved.';render()});render()</script></body></html>
