<!DOCTYPE html>
<html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Reports</title><link rel="stylesheet" href="../css/style.css"></head>
<body><div class="app"><aside class="sidebar"><h2>Expense Tracker</h2><nav><a href="dashboard.html">Dashboard</a><a href="add-expense.html">Add Transaction</a><a href="expenses.html">Transactions</a><a href="budget.html">Budget</a><a class="active" href="reports.html">Reports</a><a href="#" onclick="logout()">Logout</a></nav></aside><main class="content"><div class="topbar"><h1>Reports & Insights</h1><button class="btn primary" onclick="exportCSV()">Export CSV</button></div><div class="grid-2"><section class="form-card"><h2>Category Spending</h2><div id="cats"></div></section><section class="form-card"><h2>Financial Summary</h2><div id="summary"></div></section></div></main></div><script src="../js/common.js"></script><script>const u=requireRole('user');const a=getExpenses().filter(x=>x.email===u.email);const inc=a.filter(x=>x.type==='income').reduce((s,x)=>s+Number(x.amount),0),exp=a.filter(x=>x.type==='expense').reduce((s,x)=>s+Number(x.amount),0);const groups={};a.filter(x=>x.type==='expense').forEach(x=>groups[x.category]=(groups[x.category]||0)+Number(x.amount));cats.innerHTML=Object.keys(groups).length?Object.entries(groups).map(([k,v])=>`<p><b>${k}</b>: ${money(v)}</p>`).join(''):'<div class="empty">No expense data.</div>';summary.innerHTML=`<p>Total income: <b>${money(inc)}</b></p><p>Total expenses: <b>${money(exp)}</b></p><p>Balance: <b>${money(inc-exp)}</b></p><p>Total transactions: <b>${a.length}</b></p>`;function exportCSV(){const rows=[['Date','Title','Category','Type','Amount','Note'],...a.map(x=>[x.date,x.title,x.category,x.type,x.amount,x.note])];const csv=rows.map(r=>r.map(v=>`"${String(v).replaceAll('"','""')}"`).join(',')).join('\n');const blob=new Blob([csv],{type:'text/csv'}),url=URL.createObjectURL(blob),link=document.createElement('a');link.href=url;link.download='expense-report.csv';link.click();URL.revokeObjectURL(url)}</script></body></html>
