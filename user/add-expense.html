<!DOCTYPE html>
<html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Add Transaction</title><link rel="stylesheet" href="../css/style.css"></head>
<body><div class="app"><aside class="sidebar"><h2>Expense Tracker</h2><nav><a href="dashboard.html">Dashboard</a><a class="active" href="add-expense.html">Add Transaction</a><a href="expenses.html">Transactions</a><a href="budget.html">Budget</a><a href="reports.html">Reports</a><a href="#" onclick="logout()">Logout</a></nav></aside><main class="content"><h1>Add Transaction</h1><section class="form-card"><form id="txForm"><label>Type</label><select id="type"><option value="expense">Expense</option><option value="income">Income</option></select><label>Title</label><input id="title" placeholder="e.g. Food" required><label>Amount</label><input id="amount" type="number" min="1" step="0.01" required><label>Category</label><select id="category"><option>Food</option><option>Travel</option><option>Education</option><option>Shopping</option><option>Bills</option><option>Health</option><option>Entertainment</option><option>Other</option></select><label>Date</label><input id="date" type="date" required><label>Note</label><textarea id="note" rows="3"></textarea><button class="btn primary" type="submit">Save Transaction</button></form><p id="msg"></p></section></main></div><script src="../js/common.js"></script><script>const u=requireRole('user');date.value=new Date().toISOString().slice(0,10);txForm.addEventListener('submit',e=>{e.preventDefault();const a=getExpenses();a.push({id:Date.now(),email:u.email,type:type.value,title:title.value,amount:Number(amount.value),category:category.value,date:date.value,note:note.value});saveExpenses(a);msg.textContent='Transaction saved successfully.';msg.className='success';txForm.reset();date.value=new Date().toISOString().slice(0,10)})</script></body></html>
