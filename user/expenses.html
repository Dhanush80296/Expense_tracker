<!DOCTYPE html>
<html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Transactions</title><link rel="stylesheet" href="../css/style.css"></head>
<body><div class="app"><aside class="sidebar"><h2>Expense Tracker</h2><nav><a href="dashboard.html">Dashboard</a><a href="add-expense.html">Add Transaction</a><a class="active" href="expenses.html">Transactions</a><a href="budget.html">Budget</a><a href="reports.html">Reports</a><a href="#" onclick="logout()">Logout</a></nav></aside><main class="content"><h1>Transactions</h1><div class="toolbar"><input id="search" placeholder="Search title/category"><select id="filter"><option value="all">All</option><option value="income">Income</option><option value="expense">Expense</option></select></div><div class="table-wrap"><table class="table"><thead><tr><th>Date</th><th>Title</th><th>Category</th><th>Type</th><th>Amount</th><th>Action</th></tr></thead><tbody id="body"></tbody></table></div></main></div><script src="../js/common.js"></script><script>const u=requireRole('user');function render(){const q=search.value.toLowerCase(),f=filter.value;const a=getExpenses().filter(x=>x.email===u.email&& (f==='all'||x.type===f) && (x.title.toLowerCase().includes(q)||x.category.toLowerCase().includes(q)));body.innerHTML=a.length?a.map(x=>`<tr><td>${x.date}</td><td>${x.title}</td><td>${x.category}</td><td><span class="badge ${x.type}">${x.type}</span></td><td>${money(x.amount)}</td><td><button class="btn danger" onclick="removeTx(${x.id})">Delete</button></td></tr>`).join(''):'<tr><td colspan="6" class="empty">No transactions found.</td></tr>'}function removeTx(id){saveExpenses(getExpenses().filter(x=>x.id!==id));render()}search.oninput=render;filter.onchange=render;render()</script></body></html>
